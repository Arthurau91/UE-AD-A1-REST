services:
  movie:
    build: ./movie/
    ports:
      - "3200:3200"
  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    ports:
      - "3202:3202"
  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    ports:
      - "3201:3201"
    environment:
      SCHEDULE_URL: http://schedule:3202
      MOVIE_URL: http://movie:3200
  # to continue

