openapi: 3.0.3
info:
  title: Movies API
  version: 1.0.0
  description: |
    REST API for listing, retrieving, creating, replacing, and deleting movies.

    Movie data is stored in the service's JSON file. A movie created or replaced
    through this API has the fields `id`, `title`, `rating`, and `director`.
servers:
  - url: http://localhost:3200/
tags:
  - name: Movies
    description: Operations for movie resources
paths:
  /movies:
    get:
      tags:
        - Movies
      operationId: listMovies
      summary: List movies
      description: |
        Returns every movie currently in the JSON data store. The result is a
        JSON array; an empty store returns an empty array. The service returns
        stored records as-is, so existing records may have decimal ratings,
        while create and replace requests accept only integer ratings.
      responses:
        "200":
          description: Movies returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoredMovie"
              examples:
                default:
                  value:
                    - id: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                      title: The Good Dinosaur
                      rating: 7.4
                      director: Peter Sohn
                    - id: "a8034f44-aee4-44cf-b32c-74cf452aaaae"
                      title: The Martian
                      rating: 8.2
                      director: Ridley Scott
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/UnexpectedServerError"
    post:
      tags:
        - Movies
      operationId: createMovie
      summary: Create a movie
      description: |
        Validates the complete movie payload, generates a UUID string for `id`,
        appends the movie to the store, and returns the created representation.
        The client must not provide an `id`. Unknown properties are rejected.
      requestBody:
        required: true
        description: Movie fields to create. `id` is generated by the server.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieInput"
      responses:
        "201":
          description: Movie created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
              examples:
                default:
                  value:
                    id: "1c510c71-3bf3-45f0-b0bf-8b448f4fbde1"
                    title: Arrival
                    rating: 9
                    director: Denis Villeneuve
        "400":
          $ref: "#/components/responses/InvalidJson"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidMovie"
        "500":
          $ref: "#/components/responses/UnexpectedServerError"
  /movies/{movieid}:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    get:
      tags:
        - Movies
      operationId: getMovie
      summary: Get a movie by ID
      description: |
        Returns the stored movie whose `id` exactly matches `movieid`. The ID
        is treated as a string and is not validated as a UUID. The stored
        record is returned as-is.
      responses:
        "200":
          description: Movie found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredMovie"
              examples:
                default:
                  value:
                    id: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                    title: The Good Dinosaur
                    rating: 7.4
                    director: Peter Sohn
        "404":
          $ref: "#/components/responses/MovieNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/UnexpectedServerError"
    put:
      tags:
        - Movies
      operationId: replaceMovie
      summary: Replace a movie
      description: |
        Replaces the movie's writable fields with the supplied complete
        payload. The existing `id` is preserved and the previous record fields
        are replaced. Payload validation happens before the ID lookup, so an
        invalid payload returns `422` even if the ID does not exist.
      requestBody:
        required: true
        description: Complete replacement fields. `id` must not be included.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieInput"
      responses:
        "200":
          description: Movie replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
              examples:
                default:
                  value:
                    id: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
                    title: Arrival
                    rating: 9
                    director: Denis Villeneuve
        "400":
          $ref: "#/components/responses/InvalidJson"
        "404":
          $ref: "#/components/responses/MovieNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidMovie"
        "500":
          $ref: "#/components/responses/UnexpectedServerError"
    delete:
      tags:
        - Movies
      operationId: deleteMovie
      summary: Delete a movie
      description: |
        Removes the movie with the matching ID from the store. A successful
        deletion has no response body.
      responses:
        "204":
          description: Movie deleted; response body is empty.
        "404":
          $ref: "#/components/responses/MovieNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/UnexpectedServerError"
components:
  parameters:
    MovieId:
      name: movieid
      in: path
      required: true
      description: Exact movie ID string. The value is not required to be a UUID.
      schema:
        type: string
        example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
  schemas:
    MovieInput:
      type: object
      description: |
        Strict request body accepted by create and replace. All three
        properties are required. Values must have the declared JSON types;
        additional properties are rejected.
      additionalProperties: false
      required:
        - title
        - rating
        - director
      properties:
        title:
          type: string
          maxLength: 100
          description: Movie title; empty strings are not separately rejected.
          example: Arrival
        rating:
          type: integer
          minimum: 0
          maximum: 10
          description: Integer rating from 0 to 10 inclusive.
          example: 9
        director:
          type: string
          maxLength: 100
          description: Director name; empty strings are not separately rejected.
          example: Denis Villeneuve
    Movie:
      description: Movie representation returned after create or replace.
      allOf:
        - $ref: "#/components/schemas/MovieInput"
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
              description: UUID string generated by the service at creation.
              example: "1c510c71-3bf3-45f0-b0bf-8b448f4fbde1"
    StoredMovie:
      type: object
      description: |
        Movie record returned by list and get-by-ID. The service returns stored
        values as-is, so existing ratings may be decimal even though create and
        replace inputs require an integer rating.
      required:
        - id
        - title
        - rating
        - director
      additionalProperties: true
      properties:
        id:
          type: string
          description: Stored movie ID. Existing data is not restricted to UUIDs.
          example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
        title:
          type: string
          example: The Good Dinosaur
        director:
          type: string
          example: Peter Sohn
        rating:
          type: number
          minimum: 0
          maximum: 10
          description: Stored movie rating; existing records may contain decimals.
          example: 7.4
    Error:
      type: object
      required:
        - error
      properties:
        error:
          description: |
            Human-readable HTTP error or Pydantic validation details. Either a
            string (HTTP errors) or an array of ValidationIssue objects
            (validation errors).
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ValidationIssue"
          example: Movie does not exist
    ValidationIssue:
      type: object
      required:
        - type
        - loc
        - msg
        - input
      additionalProperties: true
      properties:
        type:
          type: string
          description: Pydantic validation error type.
          example: missing
        loc:
          type: array
          description: >-
            Location of the invalid or missing value in the request. Items are
            strings or integers.
          items:
            oneOf:
              - type: string
              - type: integer
          example:
            - rating
        msg:
          type: string
          description: Explanation of the validation failure.
          example: Field required
        input:
          description: Rejected value, when one was supplied.
        ctx:
          type: object
          description: Optional additional context from Pydantic.
          additionalProperties: true
  responses:
    MovieNotFound:
      description: No movie has the supplied ID. The service returns HTTP 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                error: Movie does not exist
    InvalidJson:
      description: Request body is empty or is not valid JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                error: The browser (or proxy) sent a request that this server could not understand.
    UnsupportedMediaType:
      description: Request body is not sent with the application/json media type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                error: The browser (or proxy) sent a request that this server could not understand.
    InvalidMovie:
      description: |
        JSON decoded successfully, but the payload did not satisfy MovieInput.
        The error array contains Pydantic validation details. Common causes
        include missing fields, wrong types, extra fields, strings longer than
        100 characters, or a rating outside the inclusive range 0 to 10.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                error:
                  - type: missing
                    loc:
                      - rating
                    msg: Field required
                    input:
                      title: Arrival
                      director: Denis Villeneuve
    MethodNotAllowed:
      description: The HTTP method is not supported for this path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                error: The method is not allowed for the requested URL.
    UnexpectedServerError:
      description: |
        Unexpected server-side failure, for example an error reading or
        writing the JSON data file. Unhandled exceptions are processed by
        Flask; their response representation may not follow the Error schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"